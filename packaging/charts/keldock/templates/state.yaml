{{- $claims := list "control-state" -}}
{{- if .Values.registrar.enabled }}{{- $claims = append $claims "registrar-state" }}{{- end -}}
{{- range $name := $claims }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: {{- include "keldock.labels" $ | nindent 4 }}
  annotations: {helm.sh/resource-policy: keep, keldock.io/retention: operator-owned}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $.Values.storageClass | quote }}
  resources: {requests: {storage: 1Gi}}
---
{{- end }}
{{- if .Values.databases.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-database-agent-state
  labels: {{- include "keldock.labels" . | nindent 4 }}
  annotations: {helm.sh/resource-policy: keep, keldock.io/retention: operator-owned}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass | quote }}
  resources: {requests: {storage: 1Gi}}
{{- end }}
