{{- $_ := include "keldock.assert" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-public
  labels: {{- include "keldock.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-control
  labels: {{- include "keldock.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name | quote }}, keldock.io/process: control}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name | quote }}, keldock.io/process: control}
    spec:
      serviceAccountName: {{ .Release.Name }}-public
      automountServiceAccountToken: false
      {{- with .Values.hostAliases }}
      hostAliases: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- include "keldock.runtimeSecurity" . | nindent 8 }}
      initContainers:
        - name: private-configuration
          image: {{ .Values.images.runtime | quote }}
          args: [init-files]
          securityContext: {{- include "keldock.containerSecurity" . | nindent 12 }}
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 250m, memory: 128Mi}}
          volumeMounts:
            - {name: input, mountPath: /input, readOnly: true}
            - {name: runtime, mountPath: /runtime}
            - {name: state, mountPath: /state}
      containers:
        - name: api
          image: {{ .Values.images.runtime | quote }}
          args: [serve, --config, /runtime/private/control.json, --migrate]
          ports: [{name: api, containerPort: 3801}]
          securityContext: {{- include "keldock.containerSecurity" . | nindent 12 }}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 384Mi}}
          startupProbe: {httpGet: {path: /healthz, port: api}, periodSeconds: 3, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /healthz, port: api}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: api}, periodSeconds: 15, failureThreshold: 4}
          env: {{- include "keldock.trustEnv" . | nindent 12 }}
          volumeMounts:
            - {name: runtime, mountPath: /runtime, readOnly: true}
            - {name: state, mountPath: /state}
            - {name: tmp, mountPath: /tmp}
            {{- include "keldock.trustMount" . | nindent 12 }}
        - name: console
          image: {{ .Values.images.console | quote }}
          ports: [{name: web, containerPort: 3800}]
          securityContext: {{- include "keldock.containerSecurity" . | nindent 12 }}
          resources: {requests: {cpu: 100m, memory: 192Mi}, limits: {cpu: "1", memory: 512Mi}}
          env:
            - {name: KELDOCK_API_ORIGIN, value: "http://127.0.0.1:3801"}
            - {name: HOSTNAME, value: "0.0.0.0"}
            - {name: PORT, value: "3800"}
          startupProbe: {httpGet: {path: /sign-in, port: web}, periodSeconds: 3, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /sign-in, port: web}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /sign-in, port: web}, periodSeconds: 15, failureThreshold: 4}
          volumeMounts: [{name: console-cache, mountPath: /app/apps/console/.next/cache}, {name: console-tmp, mountPath: /tmp}]
      volumes:
        - name: input
          secret:
            secretName: {{ .Values.installation.existingSecret | quote }}
            defaultMode: 288
            items:
              - {key: control.json, path: control.json}
              - {key: webhook.secret, path: webhook.secret}
              {{- if .Values.publisherCredential }}
              - {key: registry-password, path: registry-password}
              {{- end }}
        - {name: runtime, emptyDir: {medium: Memory, sizeLimit: 8Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: console-tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: console-cache, emptyDir: {sizeLimit: 128Mi}}
        - name: state
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-control-state}
        {{- include "keldock.trustVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-console
  labels: {{- include "keldock.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name | quote }}, keldock.io/process: control}
  ports: [{name: web, port: 3800, targetPort: web}]
