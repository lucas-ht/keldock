{{- if .Values.registry.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-registry-data
  labels: {{- include "keldock.labels" . | nindent 4 }}
  annotations: {helm.sh/resource-policy: keep, keldock.io/retention: operator-owned}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass | quote }}
  resources: {requests: {storage: {{ .Values.registry.storage | quote }}}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-registry
  labels: {{- include "keldock.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-registry
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name | quote }}, keldock.io/process: registry}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name | quote }}, keldock.io/process: registry}
    spec:
      automountServiceAccountToken: false
      securityContext: {{- include "keldock.runtimeSecurity" . | nindent 8 }}
      containers:
        - name: registry
          image: registry:3.0.0@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e
          securityContext: {{- include "keldock.containerSecurity" . | nindent 12 }}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          ports: [{name: registry, containerPort: 5000}]
          env: [{name: REGISTRY_STORAGE_DELETE_ENABLED, value: "false"}]
          readinessProbe: {httpGet: {path: /v2/, port: registry}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /v2/, port: registry}, periodSeconds: 15, failureThreshold: 4}
          volumeMounts: [{name: data, mountPath: /var/lib/registry}, {name: tmp, mountPath: /tmp}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-registry-data}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-registry
  labels: {{- include "keldock.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name | quote }}, keldock.io/process: registry}
  ports: [{name: registry, port: 5000, targetPort: registry}]
{{- end }}
