{{- if .Values.database.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-database-data
  labels: {{- include "keldock.labels" . | nindent 4 }}
  annotations: {helm.sh/resource-policy: keep, keldock.io/retention: operator-owned}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass | quote }}
  resources: {requests: {storage: {{ .Values.database.storage | quote }}}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-database-init
  labels: {{- include "keldock.labels" . | nindent 4 }}
data:
  01-keldock.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
      -v app_password="$KELDOCK_PASSWORD" <<'SQL'
    CREATE ROLE keldock LOGIN PASSWORD :'app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE;
    CREATE DATABASE keldock OWNER keldock;
    SQL
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-database
  labels: {{- include "keldock.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-database
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name | quote }}, keldock.io/process: database}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name | quote }}, keldock.io/process: database}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          securityContext: {{- include "keldock.containerSecurity" . | nindent 12 }}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: postgres}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.installation.existingSecret | quote }}, key: postgres-admin-password}}
            - name: KELDOCK_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.installation.existingSecret | quote }}, key: postgres-password}}
          startupProbe: {exec: {command: [pg_isready, -U, postgres]}, periodSeconds: 3, failureThreshold: 60}
          readinessProbe: {exec: {command: [pg_isready, -U, postgres]}, periodSeconds: 5}
          livenessProbe: {exec: {command: [pg_isready, -U, postgres]}, periodSeconds: 15, failureThreshold: 4}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: sockets, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-database-data}
        - {name: sockets, emptyDir: {medium: Memory, sizeLimit: 8Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - name: init
          configMap: {name: {{ .Release.Name }}-database-init, defaultMode: 365}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-database
  labels: {{- include "keldock.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name | quote }}, keldock.io/process: database}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
{{- end }}
