version: "3"

tasks:
  default:
    desc: List repository tasks
    cmds:
      - task --list

  bootstrap:
    desc: Install the pinned repository validation dependencies
    cmds:
      - pnpm install --frozen-lockfile --ignore-scripts
      - go mod download

  doctor:
    desc: Validate documentation, repository contracts and CI
    cmds:
      - pnpm check

  format:
    desc: Format supported repository files
    cmds:
      - pnpm format
      - golangci-lint fmt

  format:check:
    desc: Check formatting without changing files
    cmds:
      - pnpm format:check

  test:
    desc: Test repository validation behavior
    cmds:
      - pnpm test
      - go test -race ./...

  go:check:
    desc: Check Go contracts, race safety, static analysis and formatting
    cmds:
      - pnpm go:check
