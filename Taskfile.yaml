version: "3"

tasks:
  default:
    desc: List repository tasks
    cmds:
      - task --list

  bootstrap:
    desc: Install the pinned repository validation dependencies
    cmds:
      - pnpm install --frozen-lockfile --ignore-scripts
      - go mod download

  doctor:
    desc: Validate documentation, repository contracts and CI
    cmds:
      - pnpm check

  format:
    desc: Format supported repository files
    cmds:
      - pnpm format
      - golangci-lint fmt

  format:check:
    desc: Check formatting without changing files
    cmds:
      - pnpm format:check

  test:
    desc: Test repository validation behavior
    cmds:
      - pnpm test
      - go test -race ./...

  go:check:
    desc: Check Go contracts, race safety, static analysis and formatting
    cmds:
      - pnpm go:check

  local:up:
    desc: Prepare the dedicated disposable keldock-m1 cluster, registry and PostgreSQL
    cmds:
      - node tooling/local/up.mjs

  local:reset:
    desc: Recreate only the owned disposable keldock-m1 cluster and retain registry/database volumes
    cmds:
      - node tooling/local/reset.mjs

  local:test:
    desc: Exercise real PostgreSQL/runtime behavior in the dedicated disposable local target
    deps: [local:up]
    cmds:
      - node tooling/local/build-fixture.mjs
      - go test -race -tags integration -timeout=15m -count=1 -v ./test/runtime/... ./test/access/... ./test/github/... ./test/cloud/...

  local:console:api:
    desc: Run synthetic console data and a real API/worker/agent in disposable keldock-m1
    deps: [local:up]
    cmds:
      - node tooling/local/build-fixture.mjs
      - go run ./tooling/fixtures/console

  local:console:
    desc: Run the Next.js console on loopback port 3800 (start local:console:api separately)
    cmds:
      - pnpm --filter @keldock/console dev

  local:console:test:
    desc: Verify the running disposable console proxy and authenticated server rendering
    cmds:
      - node tooling/local/console-smoke.mjs

  local:alpha:up:
    desc: Prepare the separate disposable M6 PostgreSQL capability cluster
    deps: [local:up]
    cmds:
      - node tooling/alpha/up.mjs

  local:alpha:core:up:
    desc: Prepare the separate constrained M6 core cluster without optional controllers
    deps: [local:up]
    cmds:
      - node tooling/alpha/core-up.mjs

  local:alpha:postgresql:test:
    desc: Verify real PostgreSQL allocation, scoped backup, isolated WAL restore and control-plane recovery
    deps: [local:alpha:up]
    cmds:
      - docker build -f tooling/alpha/storage.Dockerfile -t localhost:5010/keldock/m6-storage:fixture .
      - node tooling/alpha/build-application.mjs
      - node tooling/alpha/restore-registry.mjs
      - go test -race -tags integration -timeout=35m -count=1 -v ./test/postgresql

  local:alpha:core:lifecycle:
    desc: Exercise uninstall retention, registrar revocation and supplied dependencies on the installed core fixture
    cmds:
      - node tooling/alpha/lifecycle/core.mjs --core

  alpha:package:
    desc: Prepare local reviewable alpha artifacts from clean committed source and explicit immutable image arguments
    cmds:
      - node tooling/alpha/package.mjs {{.CLI_ARGS}}
