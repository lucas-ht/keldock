name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pinned tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: "2026.10.19"
      - name: Install locked dependencies
        run: task bootstrap
      - name: Validate repository
        run: task doctor

  runtime:
    needs: doctor
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pinned tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: "2026.10.19"
      - name: Install locked dependencies
        run: task bootstrap
      - name: Verify disposable runtime
        run: |
          monitor_capacity() {
            while true; do
              date -u
              df -h /
              if [ -f .local/kubeconfig ]; then
                kubectl --kubeconfig .local/kubeconfig --context k3d-keldock-m1 --request-timeout=5s get nodes \
                  -o=jsonpath='{range .items[*]}{.metadata.name}{" taints="}{.spec.taints}{" conditions="}{range .status.conditions[*]}{.type}{":"}{.status}{" "}{end}{"\n"}{end}' || true
              fi
              sleep 30
            done
          }
          monitor_capacity &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          task local:test
      - name: Report disposable Docker capacity
        if: always()
        run: docker system df
